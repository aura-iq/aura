<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css">
  <title>أورا | لوحة المستخدم</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo" style="text-decoration:none">
      <i class="fas fa-water"></i> أورا
    </a>
    <div style="display:flex;align-items:center;gap:0.8rem">
      <a href="#" class="user-chip" id="user-chip"><i class="fas fa-user"></i> <span>...</span></a>
      <button class="nav-btn" id="logout-btn"><i class="fas fa-right-from-bracket"></i> خروج</button>
    </div>
  </nav>

  <main class="page-wrap container">
    <h1 class="section-title" style="text-align:right">لوحة التحكم</h1>
    <p class="section-subtitle" style="text-align:right">مرحباً بك في حسابك</p>

    <div class="grid-2">
      <div class="card">
        <h3><i class="fas fa-user-circle"></i> الملف الشخصي</h3>
        <form id="profile-form">
          <div class="form-group">
            <label>الاسم الكامل</label>
            <input type="text" name="fullName" id="p-fullName" />
          </div>
          <div class="form-group">
            <label>البريد الإلكتروني</label>
            <input type="email" id="p-email" disabled />
          </div>
          <div class="form-group">
            <label>رقم الهاتف</label>
            <input type="text" name="phone" id="p-phone" />
          </div>
          <div class="form-group">
            <label>نبذة</label>
            <textarea name="bio" id="p-bio"></textarea>
          </div>
          <button type="submit" class="btn-primary" id="save-profile">
            <i class="fas fa-save"></i> حفظ
          </button>
        </form>
      </div>

      <div>
        <div class="card">
          <h3><i class="fas fa-shield-halved"></i> الأمان</h3>
          <form id="password-form">
            <div class="form-group">
              <label>كلمة المرور الحالية</label>
              <input type="password" name="currentPassword" required autocomplete="current-password" />
            </div>
            <div class="form-group">
              <label>كلمة المرور الجديدة</label>
              <input type="password" name="newPassword" required minlength="8" autocomplete="new-password" />
            </div>
            <button type="submit" class="btn-secondary" id="save-password">
              <i class="fas fa-key"></i> تغيير كلمة المرور
            </button>
          </form>
        </div>

        <div class="card">
          <h3><i class="fas fa-bell"></i> الإشعارات</h3>
          <div id="notifications-list">
            <div class="empty-state"><i class="fas fa-bell-slash"></i>لا توجد إشعارات</div>
          </div>
        </div>
      </div>
    </div>
  </main>

<script>
  (function(){
    var h = window.location.hostname;
    window.AURA_API = window.location.origin + '/api';
  })();
</script>
  <script type="module" src="./js/dashboard.js"></script>
</body>
</html>
