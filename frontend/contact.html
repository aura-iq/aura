  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet" />

<body class="page-contact">

    <!-- Background Layers -->
    <div class="bg-layers" id="bg-layers">
      <div class="bg-layer active" data-section="section-1" style="background-image: url('images/ice/ice-contact.jpg')"></div>
      <div class="bg-layer" data-section="section-2" style="background-image: url('images/ice/ice-features.jpg')"></div>
    </div>
  <nav class="navbar">
    <a href="index.html" class="logo" style="text-decoration:none">
      <i class="fas fa-water"></i> أورا
    </a>
    <div id="nav-auth-slot">
      <a href="index.html" class="nav-btn" style="text-decoration:none">الرئيسية</a>
    </div>
  </nav>

  <main class="page-wrap container">
    <h1 class="section-title">تواصل معنا</h1>
    <p class="section-subtitle">نحن هنا للإجابة على استفساراتك</p>

    <div id="chat-loading" class="chat-loading">
      <span class="spinner"></span>
      <p>جاري التحميل...</p>
    </div>

    <div id="chat-need-auth" class="card chat-auth-prompt" style="display:none">
      <i class="fas fa-lock chat-lock-icon"></i>
      <h3>يجب تسجيل الدخول</h3>
      <p>لإرسال رسالة إلى فريق الدعم، يرجى تسجيل الدخول أولاً.</p>
      <a href="auth.html" class="btn-primary" style="text-decoration:none">
        <i class="fas fa-right-to-bracket"></i> تسجيل الدخول
      </a>
    </div>

    <div id="chat-container" class="chat-wrapper" style="display:none">
      <div class="chat-header">
        <div class="chat-header-info">
          <i class="fas fa-headset"></i>
          <div>
            <strong>فريق الدعم</strong>
            <small>متصل عادة خلال ساعات</small>
          </div>
        </div>
      </div>

      <div id="chat-messages" class="chat-messages"></div>

      <form id="chat-form" class="chat-form">
        <textarea id="chat-input" placeholder="اكتب رسالتك..." maxlength="2000" rows="1"></textarea>
        <button type="submit" id="chat-send-btn" class="chat-send-btn">
          <i class="fas fa-paper-plane"></i>
        </button>
      </form>
    </div>
  </main>

  <script>window.AURA_API = '/api';</script>
  <script type="module" src="./js/contact.js"></script>
<script src="js/bg-scroll.js"></script>
  </body>
</html>
