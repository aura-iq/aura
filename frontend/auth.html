<head>
  <meta charset="UTF-8" />

  <meta name="theme-color" content="#0a0a0a" />

  <meta property="og:title" content="تسجيل الدخول | أورا" />
  <meta property="og:description" content="سجّل دخولك إلى أورا أو أنشئ حساباً جديداً للاستفادة من خدماتنا." />

  <meta property="og:locale" content="ar_IQ" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

<body class="page-auth">

    <!-- Aurora Background -->
    <div class="aurora-bg" id="aurora-bg">
      <div class="aurora-shape aurora-shape-1"></div>
      <div class="aurora-shape aurora-shape-2"></div>
      <div class="aurora-shape aurora-shape-3"></div>
      <div class="aurora-layer aurora-1"></div>
      <div class="aurora-layer aurora-2"></div>
      <div class="aurora-layer aurora-3"></div>
      <div class="snow-particles" id="snow-particles"></div>
    </div>
  <nav class="navbar">
    <a href="index.html" class="logo" style="text-decoration:none">
      <i class="fas fa-water"></i> أورا
    </a>
    <div><a href="index.html" class="nav-btn" style="text-decoration:none">الرئيسية</a></div>
  </nav>

  <main class="page-wrap" style="display:flex;align-items:center;justify-content:center;padding-top:140px">
    <div class="card" style="max-width:520px;width:100%">
      <div class="auth-tabs">
        <button id="tab-login" class="active" type="button">تسجيل الدخول</button>
        <button id="tab-register" type="button">إنشاء حساب</button>
      </div>

      <form id="form-login">
        <div class="form-group">
          <label>البريد الإلكتروني</label>
          <input type="email" name="email" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label>كلمة المرور</label>
          <input type="password" name="password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn-primary btn-block" id="login-submit">
          <i class="fas fa-right-to-bracket"></i> دخول
        </button>
        <div style="text-align:center;margin-top:1rem">
          <a href="#" id="forgot-link" style="color:var(--text-secondary);font-size:0.9rem">
            نسيت كلمة المرور؟
          </a>
        </div>
      </form>

      <form id="form-register" style="display:none">
        <div class="form-group">
          <label>الاسم الكامل</label>
          <input type="text" name="fullName" required autocomplete="name" />
        </div>
        <div class="form-group">
          <label>البريد الإلكتروني</label>
          <input type="email" name="email" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label>كلمة المرور</label>
          <input type="password" name="password" required minlength="8" autocomplete="new-password" />
          <small style="color:var(--text-secondary);font-size:0.8rem">
            8 أحرف على الأقل، حرف كبير وصغير ورقم
          </small>
        </div>
        <button type="submit" class="btn-primary btn-block" id="register-submit">
          <i class="fas fa-user-plus"></i> إنشاء الحساب
        </button>
      </form>
    </div>
  </main>

  <script>
    (function () {
      var h = window.location.hostname;
      window.AURA_API = '/api';
    })();
  </script>

  
  <script src="js/aurora-bg.js"></script>
  </body>
</html>
<script>
  // امسح أي tokens قديمة (لمرة واحدة)
  (function(){
    var v = localStorage.getItem('aura_reset_v2');
    if (!v) {
      localStorage.removeItem('accessToken');
      localStorage.removeItem('token');
      localStorage.setItem('aura_reset_v2', '1');
    }
  })();
</script>

  <script type="module">
    import { login, register, bootstrapAuth } from './js/auth.js';
    import { showToast } from './js/notifications.js';

    var params = new URLSearchParams(window.location.search);
    var redirectTo = params.get('redirect') || null;

    function getRedirectTarget(user) {
      if (redirectTo) return redirectTo;
      return user.role === 'ADMIN' ? 'admin.html' : 'dashboard.html';
    }

    bootstrapAuth().then(function (u) {
      if (u) {
        window.location.href = getRedirectTarget(u);
      }
    });

    var tabLogin = document.getElementById('tab-login');
    var tabRegister = document.getElementById('tab-register');
    var formLogin = document.getElementById('form-login');
    var formRegister = document.getElementById('form-register');

    tabLogin.onclick = function () {
      tabLogin.classList.add('active');
      tabRegister.classList.remove('active');
      formLogin.style.display = '';
      formRegister.style.display = 'none';
    };
    tabRegister.onclick = function () {
      tabRegister.classList.add('active');
      tabLogin.classList.remove('active');
      formRegister.style.display = '';
      formLogin.style.display = 'none';
    };

    formLogin.addEventListener('submit', async function (e) {
      e.preventDefault();
      var btn = document.getElementById('login-submit');
      var orig = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> جارٍ الدخول...';
      var fd = new FormData(formLogin);
      try {
        var user = await login({ email: fd.get("email"), password: fd.get("password") });
        localStorage.setItem("aura_user", JSON.stringify(user));
        showToast('تم تسجيل الدخول بنجاح', 'success');
        setTimeout(function () {
          window.location.href = getRedirectTarget(user);
        }, 400);
      } catch (err) {
        showToast(err.message || 'فشل تسجيل الدخول', 'error');
        btn.disabled = false;
        btn.innerHTML = orig;
      }
    });

    formRegister.addEventListener('submit', async function (e) {
      e.preventDefault();
      var btn = document.getElementById('register-submit');
      var orig = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> جارٍ الإنشاء...';
      var fd = new FormData(formRegister);
      try {
        var user = await register({
          fullName: fd.get('fullName'),
          email: fd.get('email'),
          password: fd.get('password'),
        });
        showToast('تم إنشاء الحساب بنجاح', 'success');
        setTimeout(function () {
          window.location.href = getRedirectTarget(user);
        }, 400);
      } catch (err) {
        showToast(err.message || 'فشل إنشاء الحساب', 'error');
        btn.disabled = false;
        btn.innerHTML = orig;
      }
    });

    document.getElementById('forgot-link').onclick = async function (e) {
      e.preventDefault();
      var email = prompt('أدخل بريدك الإلكتروني:');
      if (!email) return;
      try {
        var m = await import('./js/api.js');
        await m.api.post('/auth/forgot-password', { email: email });
        showToast('إذا كان البريد مسجلاً، ستصلك رسالة', 'info');
      } catch (err) {
        showToast(err.message, 'error');
      }
    };
  </script>
  </body>
</html>
