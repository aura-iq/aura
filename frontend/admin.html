<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css">
  <title>أورا | لوحة الإدارة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
<link rel="icon" href="images/logo.png.jpg" />
  </head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo" style="text-decoration:none">
      <i class="fas fa-shield-halved"></i> أورا | إدارة
    </a>
    <div style="display:flex;align-items:center;gap:0.8rem">
      <a href="dashboard.html" class="user-chip"><i class="fas fa-user"></i> حسابي</a>
    </div>
  </nav>

  <main class="page-wrap container">
    <h1 class="section-title" style="text-align:right">لوحة الإدارة</h1>

    <div id="stats-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;margin-bottom:2rem"></div>

    <div class="tabs">
      <button class="active" data-tab="users" type="button"><i class="fas fa-users"></i> المستخدمون</button>
      <button data-tab="messages" type="button"><i class="fas fa-bell"></i> الإشعارات</button>
      <button data-tab="broadcast" type="button"><i class="fas fa-bullhorn"></i> إشعار جماعي</button>
      <button data-tab="chats" type="button"><i class="fas fa-comments"></i> المحادثات</button>
    </div>

    <section class="card" id="tab-users">
      <div style="display:flex;gap:0.6rem;margin-bottom:1rem;flex-wrap:wrap">
        <input id="user-search" placeholder="بحث بالبريد أو الاسم..."
          style="flex:1;min-width:200px;background:rgba(0,0,0,0.35);border:1px solid var(--glass-border);border-radius:12px;padding:0.8rem 1rem;color:var(--text-primary);font-family:inherit" />
        <button class="btn-primary" id="user-search-btn" type="button"><i class="fas fa-search"></i> بحث</button>
      </div>
      <div style="overflow-x:auto">
        <table class="data-table" id="users-table">
          <thead>
            <tr><th>الاسم</th><th>البريد</th><th>الدور</th><th>الحالة</th><th>التاريخ</th><th>إجراءات</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>


    <section class="card" id="tab-messages" style="display:none">
      <div class="notifications-header">
        <h3><i class="fas fa-bell"></i> الإشعارات</h3>
        <button id="refresh-notifications" class="nav-btn" style="padding:0.5rem 1rem;font-size:0.85rem">
          <i class="fas fa-rotate"></i> تحديث
        </button>
      </div>
      <div id="notifications-list" class="notifications-list">
        <div class="empty-state"><i class="fas fa-spinner fa-spin"></i></div>
      </div>
    </section>

    <section class="card" id="tab-broadcast" style="display:none">
      <form id="broadcast-form">
        <div class="form-group">
          <label>العنوان</label>
          <input type="text" name="title" required maxlength="120" />
        </div>
        <div class="form-group">
          <label>النص</label>
          <textarea name="body" required maxlength="1000"></textarea>
        </div>
        <div class="form-group">
          <label>الفئة المستهدفة</label>
          <select name="role">
            <option value="">الكل</option>
            <option value="USER">المستخدمون</option>
            <option value="ADMIN">المديرون</option>
          </select>
        </div>
        <button type="submit" class="btn-primary"><i class="fas fa-paper-plane"></i> إرسال</button>
      </form>
    </section>
  
    <!-- المحادثات -->
    <section class="card" id="tab-chats" style="display:none;padding:0;overflow:hidden">
      <div class="chats-layout">
        <aside class="chats-sidebar">
          <div class="chats-sidebar-header">
            <i class="fas fa-inbox"></i>
            <span>المحادثات</span>
            <button id="refresh-chats" title="تحديث"><i class="fas fa-rotate"></i></button>
          </div>
          <div id="chats-list" class="chats-list">
            <div class="empty-state"><i class="fas fa-spinner fa-spin"></i></div>
          </div>
        </aside>

        <div class="chats-main">
          <div id="chat-empty-state" class="chats-empty">
            <i class="fas fa-comments"></i>
            <p>اختر محادثة لعرضها</p>
          </div>

          <div id="chat-view" style="display:none;height:100%;display:none;flex-direction:column">
            <div class="chats-view-header">
              <div>
                <strong id="chat-view-name">—</strong>
                <small id="chat-view-email">—</small>
              </div>
            </div>

            <div id="chat-view-messages" class="chats-messages"></div>

            <form id="chat-reply-form" class="chats-form">
              <textarea id="chat-reply-input" placeholder="اكتب ردك..." maxlength="2000" rows="1"></textarea>
              <button type="submit" class="chat-send-btn" id="chat-reply-btn">
                <i class="fas fa-paper-plane"></i>
              </button>
            </form>
          </div>
        </div>
      </div>
    </section>

</main>

<script>
  (function(){
    var h = window.location.hostname;
    window.AURA_API = '/api';
  })();
</script>
  <script type="module" src="./js/admin.js"></script>
</body>
</html>
